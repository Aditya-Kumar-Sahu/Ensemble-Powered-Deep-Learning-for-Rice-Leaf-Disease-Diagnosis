---
# Docker Compose configuration

version: '3.8'

services:
  # FastAPI service
  api:
    build: .
    container_name: rice-disease-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./results:/app/results
    command: python apps/fastapi_app.py
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Gradio web app service
  webapp:
    build: .
    container_name: rice-disease-webapp
    ports:
      - "7860:7860"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: python apps/gradio_app.py
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
